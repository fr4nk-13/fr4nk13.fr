name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a running one is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The version of balzac used to build the site. Change it to upgrade.
  BALZAC_REF: v0.1.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install balzac
        run: |
          curl --fail --location --silent --show-error --output balzac \
            "https://github.com/fr4nk-13/balzac/releases/download/${BALZAC_REF}/balzac-linux-x86_64"
          chmod +x balzac

      - name: Build the site
        run: ./balzac build site _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
