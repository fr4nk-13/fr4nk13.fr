<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block head_title %}{{ title }} · fr4nk13.fr{% endblock %}</title>
        {% if description %}
        <meta name="description" content="{{ description }}">
        {% endif %}
        <link rel="icon" href="{{ base_url }}favicon.ico" sizes="any">
        <link rel="apple-touch-icon" href="{{ base_url }}apple-touch-icon.png">
        <link rel="stylesheet" href="{{ base_url }}style.css">
        <link rel="alternate" type="application/rss+xml" title="fr4nk13.fr" href="{{ base_url }}feed.xml">
        <script src="{{ base_url }}site.js"></script>
        <script defer
            src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
            integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU"
            crossorigin="anonymous"></script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to content</a>

        <header class="site-header">
            <div class="wrap site-header-inner">
                <a class="brand" href="{{ base_url }}">
                    <img class="brand-avatar" src="{{ base_url }}avatar.jpg" alt="" width="32" height="32">
                    <span>fr4nk13</span>
                </a>
                <nav class="site-nav" aria-label="Main">
                    <a href="{{ base_url }}blog.html">
                        <svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M4 16l1-4 8.5-8.5a1.6 1.6 0 0 1 2.3 0l.7.7a1.6 1.6 0 0 1 0 2.3L8 15zM12 5l3 3"/>
                        </svg>Blog</a>
                    <a href="{{ base_url }}bookshelf.html">
                        <svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M10 5.5C8.5 4.400 6.3 4 3.5 4v10.5c2.800 0 5 .4 6.5 1.500 1.500-1.100 3.700-1.500 6.5-1.500V4c-2.800 0-5 .4-6.5 1.500zM10 5.5V16"/>
                        </svg>Bookshelf</a>
                    <a href="{{ base_url }}tags.html">
                        <svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M3 3h6.5l7.5 7.5-6.5 6.5L3 9.5z"/>
                            <circle class="nav-icon-dot" cx="6.75" cy="6.75" r="1.25"/>
                        </svg>Tags</a>
                    <a href="https://github.com/fr4nk-13">
                        <svg class="nav-icon nav-icon-solid" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>GitHub</a>
                    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" hidden>
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M10 2.75a7.25 7.25 0 0 0 0 14.5z" fill="currentColor"/>
                        </svg>
                    </button>
                </nav>
            </div>
        </header>

        <main id="main" class="site-main">
            {% block main %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="wrap site-footer-inner">
                <p>
                    Built with
                    <a class="footer-brand" href="https://github.com/fr4nk-13/balzac">
                        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                            <path class="brand-nib" d="M25 3 C14 6 8 14 7 25 l5-5 c6-1 11-6 13-17z"/>
                            <path class="brand-stem" d="M4 29 L15 15"/>
                        </svg>balzac</a>
                </p>
                <p class="footer-links">
                    <a class="footer-feed" href="{{ base_url }}feed.xml">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <circle cx="4.5" cy="15.5" r="2" fill="currentColor"/>
                            <path d="M3 9a8 8 0 0 1 8 8M3 3a14 14 0 0 1 14 14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
                        </svg>RSS</a>
                    <a href="#main">Back to top</a>
                </p>
            </div>
        </footer>

        {% block scripts %}{% endblock %}
    </body>
</html>
